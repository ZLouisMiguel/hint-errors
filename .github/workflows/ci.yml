name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['14.x', '18.x', '20.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Upgrade npm on Node 14 (its bundled npm 6 can't read lockfileVersion 3)
        if: matrix.node-version == '14.x'
        run: npm install -g npm@8

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  package:
    name: Package health (types + tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build type declarations
        run: npm run build:types

      - name: Verify packed tarball contains runtime and types
        run: |
          npm pack --dry-run --json > packed.json
          node -e '
            const fs = require("fs");
            const [pkg] = JSON.parse(fs.readFileSync("packed.json", "utf8"));
            const files = pkg.files.map((f) => f.path);
            const required = [
              "README.md",
              "index.js", "index.mjs",
              "server.js", "server.mjs",
              "src/hints.js", "src/parser.js", "src/formatter.js",
              "dist/index.d.ts", "dist/server.d.ts",
            ];
            const missing = required.filter((f) => !files.includes(f));
            const leaked = files.filter(
              (f) => f.startsWith("test/") || f.startsWith("docs/"),
            );
            if (missing.length) {
              throw new Error("tarball is missing: " + missing.join(", "));
            }
            if (leaked.length) {
              throw new Error("tarball leaks non-published files: " + leaked.join(", "));
            }
            console.log("tarball OK — " + files.length + " files");
          '