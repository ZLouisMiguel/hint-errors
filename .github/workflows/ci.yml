name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['14.x', '18.x', '20.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Upgrade npm on Node 14 (its bundled npm 6 can't read lockfileVersion 3)
        if: matrix.node-version == '14.x'
        run: npm install -g npm@8

      - name: Install
        run: npm ci

      - name: Test
        run: npm test