<svg width="680" height="300" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>hint-errors logo</title>
  <desc>Terminal-style logo for hint-errors npm package with a clean iconic lightbulb</desc>
  <defs>
    <style>
      .terminal-bg { fill: #1e1e1c; }
      .terminal-bar { fill: #2c2c2a; }
      .code-text { fill: #c2c0b6; }
      .pkg-name { fill: #ffffff; }
      .dim-text { fill: #888780; }
      .squiggle { stroke: #E24B4A; }
      .hint-label { fill: #EF9F27; }
      .hint-box { fill: #2c2c2a; stroke: #EF9F27; }
      .separator { stroke: #3d3d3a; }
      .npm-text { fill: #ffffff; }
      .cursor { fill: #EF9F27; }
    </style>
  </defs>

  <rect class="terminal-bg" x="20" y="20" width="640" height="260" rx="12"/>
  <rect class="terminal-bar" x="20" y="20" width="640" height="36" rx="12"/>
  <rect class="terminal-bar" x="20" y="44" width="640" height="12"/>

  <circle fill="#E24B4A" cx="48" cy="38" r="6"/>
  <circle fill="#BA7517" cx="70" cy="38" r="6"/>
  <circle fill="#639922" cx="92" cy="38" r="6"/>
  <text class="dim-text" x="340" y="43" text-anchor="middle" font-family="monospace" font-size="12">node — hint-errors</text>

  <ellipse cx="80" cy="128" rx="34" ry="32" fill="#EF9F27" opacity="0.13"/>

  <path d="M80 78 C 99 78, 112 92, 112 112 C 112 128, 104 140, 93 147 C 91 149, 90 151, 90 154 L 70 154 C 70 151, 69 149, 67 147 C 56 140, 48 128, 48 112 C 48 92, 61 78, 80 78 Z" fill="#EF9F27"/>
  <path d="M80 84 C 94 84, 105 95, 105 112 C 105 125, 99 135, 90 142 C 89 143, 88 145, 88 147 L 72 147 C 72 145, 71 143, 70 142 C 61 135, 55 125, 55 112 C 55 95, 66 84, 80 84 Z" fill="#FCDE5A" opacity="0.45"/>

  <path d="M70 154 Q70 158 71 159 L89 159 Q90 158 90 154 Z" fill="#B4B2A9"/>
  <path d="M71 159 Q71 163 72 164 L88 164 Q89 163 89 159 Z" fill="#9e9c96"/>
  <path d="M72 164 Q72 168 74 169 Q80 171 86 169 Q88 168 88 164 Z" fill="#B4B2A9"/>
  <line x1="70" y1="157" x2="90" y2="157" stroke="#6e6c68" stroke-width="0.7"/>
  <line x1="71" y1="161" x2="89" y2="161" stroke="#6e6c68" stroke-width="0.7"/>
  <line x1="72" y1="165" x2="88" y2="165" stroke="#6e6c68" stroke-width="0.7"/>
  <ellipse cx="80" cy="170" rx="4.5" ry="2" fill="#7a7875"/>

  <g fill="none" stroke="#C07010" stroke-width="1.3" stroke-linecap="round">
    <line x1="76" y1="152" x2="76" y2="138"/>
    <line x1="84" y1="152" x2="84" y2="138"/>
    <path d="M76 138 Q75 132 78 129 Q80 127 82 129 Q85 132 84 138"/>
  </g>

  <g stroke="#EF9F27" stroke-linecap="round">
    <line x1="80" y1="72" x2="80" y2="63" stroke-width="2.5"/>
    <line x1="96" y1="77" x2="101" y2="70" stroke-width="2.2"/>
    <line x1="107" y1="92" x2="115" y2="88" stroke-width="2.2"/>
    <line x1="113" y1="112" x2="121" y2="112" stroke-width="2"/>
    <line x1="64" y1="77" x2="59" y2="70" stroke-width="2.2"/>
    <line x1="53" y1="92" x2="45" y2="88" stroke-width="2.2"/>
    <line x1="47" y1="112" x2="39" y2="112" stroke-width="2"/>
  </g>

  <line class="separator" x1="138" y1="72" x2="138" y2="258" stroke-width="1"/>

  <text x="156" y="98" font-family="monospace" font-size="13">
    <tspan class="dim-text">$ </tspan><tspan class="code-text">npm install </tspan><tspan fill="#97C459">hint-errors</tspan>
  </text>

  <text class="pkg-name" x="156" y="152" font-family="monospace" font-size="38" font-weight="700" letter-spacing="-0.5">hint<tspan fill="#E24B4A">-</tspan>errors</text>

  <path class="squiggle" fill="none" stroke-width="2.2" stroke-linecap="round"
