  <rect class="hint-box" x="274" y="176" width="220" height="38" rx="6" stroke-width="1"/>
  <polygon class="hint-box" points="298,176 306,176 302,170" stroke="#EF9F27" stroke-width="1" stroke-linejoin="round"/>
  <text class="hint-label" x="284" y="191" font-family="monospace" font-size="11" font-weight="700">hint</text>
  <text class="code-text" x="318" y="191" font-family="monospace" font-size="11">TypeError · check line 4</text>
  <text class="dim-text" x="284" y="207" font-family="monospace" font-size="10.5">→ value may be undefined here</text>

  <rect class="cursor" x="467" y="124" width="3" height="26" rx="1"/>

  <rect fill="#E24B4A" x="156" y="230" width="36" height="18" rx="3"/>
  <text class="npm-text" x="174" y="243" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700">npm</text>
  <text class="dim-text" x="200" y="243" font-family="monospace" font-size="11">JavaScript errors, done right</text>
</svg>
